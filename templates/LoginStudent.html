<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <form method="POST">
        {{ form.hidden_tag() }}
        
        <p>
            {{ form.g_suite.label }}<br>
            {{ form.g_suite(size=30) }}
        </p>

        <p>
            {{ form.sr_code.label }}<br>
            {{ form.sr_code(size=30) }}
        </p>
         
        <p>{{ form.submit() }}</p>

        {% for field in form %}
            {% for error in field.errors %}
                <p style="color:red;">{{ error }}</p>
            {% endfor %}
        {% endfor %}
    </form>

    <a href="{{ url_for('index') }}">Back to Homepage</a>
</body>
</html>
